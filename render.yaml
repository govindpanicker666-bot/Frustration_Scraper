services:
  - type: web
    name: frustration-scraper
    env: node
    plan: free
    buildCommand: >
      npm install &&
      python3 -m pip install --break-system-packages --disable-pip-version-check -r scripts/toolzerhub/requirements.txt &&
      PLAYWRIGHT_BROWSERS_PATH=0 npx playwright install --with-deps chromium &&
      PLAYWRIGHT_BROWSERS_PATH=0 node --input-type=module -e "import { chromium } from 'playwright'; const executable = chromium.executablePath(); const browser = await chromium.launch({ headless: true, channel: 'chromium', args: ['--no-sandbox'] }); console.log('Verified project-local Chromium launch: ' + executable); await browser.close();" &&
      npm run build
    startCommand: node .output/server/index.mjs
    envVars:
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0"
      - key: NITRO_PRESET
        value: render-com
