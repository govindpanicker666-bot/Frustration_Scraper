services:
  - type: web
    name: frustration-scraper
    env: node
    plan: free
    buildCommand: npm install && python3 -m pip install --break-system-packages --disable-pip-version-check -r scripts/toolzerhub/requirements.txt && PLAYWRIGHT_BROWSERS_PATH=0 npx playwright install --with-deps --only-shell chromium && npm run build
    startCommand: node .output/server/index.mjs
    envVars:
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0"
      - key: NITRO_PRESET
        value: render-com